[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Build Strategy ---
; Merges bootloader + partitions + app into a single binary for easy distribution
extra_scripts = merge_bin.py

; --- Compiler Discipline ---
build_flags = 
    -D BOARD_HELTEC_V3
    -D RNS_LOGGING_ENABLED
    -D CORE_DEBUG_LEVEL=3
    ; Strict warnings. We don't want sloppy code hiding in the mesh.
    -Wall
    -Wextra
    ; Optimization: balance size and speed
    -Os 
    ; Packet Buffer Sizing (Matches RNS MTU)
    -D RNS_MAX_PACKET_SIZE=512

; --- Dependency Management ---
; "deep+" is CRITICAL. It forces the linker to index our flattened 
; vendored library in lib/Monocypher correctly.
lib_ldf_mode = deep+

lib_deps =
    jgromes/RadioLib @ ^6.3.0
    bblanchon/ArduinoJson @ ^6.21.0
    h2zero/NimBLE-Arduino @ ^1.4.0

[env:sensecap_t1000]
; NOTE: "xiaoblesense_adafruit" is not yet in the mainline platformio/platform-nordicnrf52
; registry release (see platformio/platform-nordicnrf52#151, open since 2022). Pull the
; board definition straight from the fork branch that carries it until it lands upstream.
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; The Adafruit nRF52 bootloader boots from a .uf2 image, not .bin/.hex. The board package
; ships uf2conv.py but doesn't wire it into the build, so we do it ourselves post-build.
extra_scripts = post:generate_uf2.py

build_flags =
    -D BOARD_SENSECAP_T1000
    -D RNS_LOGGING_ENABLED
    -D CORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -Os
    -D RNS_MAX_PACKET_SIZE=512

lib_ldf_mode = deep+
lib_deps =
    jgromes/RadioLib @ ^6.3.0
    bblanchon/ArduinoJson @ ^6.21.0
    kokke/tiny-AES-c
    ; NOTE: NimBLE-Arduino is ESP32-only; this board uses the Adafruit core's
    ; built-in Bluefruit BLE stack instead (see RetiBLE.h).
