name: RNS-C Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-compliance:
    name: Protocol Compliance (host tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ground-truth Reticulum implementation
        run: pip install rns==1.3.7

      - name: Build and run host protocol/crypto tests
        run: ./test/host/build.sh

  build:
    name: Compile Firmware
    needs: protocol-compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compile ESP32
        run: pio run -e heltec_wifi_lora_32_V3
        
      - name: Compile SenseCAP T1000-E
        run: pio run -e sensecap_t1000

      - name: Verify & Checksum
        id: verify
        run: |
          BUILD_PATH_ESP=".pio/build/heltec_wifi_lora_32_V3/firmware_merged.bin"
          BUILD_PATH_NRF=".pio/build/sensecap_t1000/firmware.uf2"
          
          if [ -f "$BUILD_PATH_ESP" ] && [ -f "$BUILD_PATH_NRF" ]; then
            echo "::notice::Binary builds successful"
            # Calculate SHA256 for security verification
            sha256sum "$BUILD_PATH_ESP" > firmware_esp32.sha256
            sha256sum "$BUILD_PATH_NRF" > firmware_t1000e.sha256
            
            echo "esp_path=$BUILD_PATH_ESP" >> $GITHUB_OUTPUT
            echo "nrf_path=$BUILD_PATH_NRF" >> $GITHUB_OUTPUT
            echo "esp_hash=firmware_esp32.sha256" >> $GITHUB_OUTPUT
            echo "nrf_hash=firmware_t1000e.sha256" >> $GITHUB_OUTPUT
          else
            echo "::error::Binaries not found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmwares
          path: |
            ${{ steps.verify.outputs.esp_path }}
            ${{ steps.verify.outputs.nrf_path }}
            ${{ steps.verify.outputs.esp_hash }}
            ${{ steps.verify.outputs.nrf_hash }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Firmwares
        uses: actions/download-artifact@v4
        with:
          name: firmwares

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=v0.2.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: RNS-C Firmware ${{ steps.tag.outputs.release_tag }}
          files: |
             firmware_merged.bin
             firmware.uf2
             firmware_esp32.sha256
             firmware_t1000e.sha256
          generate_release_notes: true
          body: |
            ## 🚀 New Build
            **Commit:** ${{ github.sha }}
            
            ### 📦 SenseCAP T1000-E Installation
            1. Download `firmware.uf2`
            2. Double tap the reset button to mount the `T1000EBOOT` drive.
            3. Drag and drop `firmware.uf2` into the drive.

            ### 📦 ESP32 Heltec V3 Installation
            1. Download `firmware_merged.bin`
            2. Go to [Espressif Web Tool](https://espressif.github.io/esptool-js/)
            3. Connect Device
            4. Flash `firmware_merged.bin` at offset `0x0`